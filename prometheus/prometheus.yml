global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # application metrics, re-exported by the OpenTelemetry collector
  - job_name: taskapi
    static_configs:
      - targets: ["otel-collector:8889"]

  # the collector's own health metrics
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
